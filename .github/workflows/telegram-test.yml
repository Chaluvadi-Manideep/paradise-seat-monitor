name: Telegram Test

on:
  workflow_dispatch:

jobs:
  test-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Send test notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e

          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "TELEGRAM_BOT_TOKEN is missing"
            exit 1
          fi

          if [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "TELEGRAM_CHAT_ID is missing"
            exit 1
          fi

          response=$(curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🔔 Paradise Seat Monitor test successful! GitHub Actions can reach your Telegram bot." )

          echo "$response" | python -c 'import json,sys; data=json.load(sys.stdin); print("Telegram API ok:", data.get("ok")); print("Message sent successfully." if data.get("ok") else data.get("description", "Telegram API request failed")); sys.exit(0 if data.get("ok") else 1)'
