name: Paradise Seat Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paradise-seat-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check seats
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Persist alert state
        if: always()
        run: |
          git config user.name "paradise-seat-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/alert_state.json
          git diff --cached --quiet || git commit -m "chore: persist monitor state"
          git push || true

      - name: Upload diagnostic screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bookmyshow-diagnostic
          path: artifacts/
          if-no-files-found: ignore
